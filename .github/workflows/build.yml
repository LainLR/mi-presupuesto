name: Publicar app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  web:
    name: Versión web (iPhone y navegador)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Marcar la versión
        run: sed -i "s/__BUILD__/${{ github.run_number }}/" app/src/main/assets/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/src/main/assets

      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: App Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recuperar la firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64. Agrégalo en Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/presupuesto.jks

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar el APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar archivo
        run: cp app/build/outputs/apk/release/app-release.apk MiPresupuesto.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mi Presupuesto 1.0.${{ github.run_number }}
          body: Descarga MiPresupuesto.apk desde el celular e instálalo encima de la versión anterior; tus datos se mantienen.
          files: MiPresupuesto.apk
          make_latest: true
